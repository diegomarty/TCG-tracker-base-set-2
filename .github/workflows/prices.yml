name: Actualizar precios Cardmarket

on:
  schedule:
    - cron: "17 3 * * 1"   # lunes 03:17 UTC
  workflow_dispatch:
    inputs:
      max_age:
        description: "Días antes de refrescar una carta (0 = todas)"
        default: "6"
      only:
        description: "Solo estos números de carta (ej. 4,2,10). Vacío = todas"
        default: ""
      scrape:
        description: "Intentar scraping de Cardmarket (desde GitHub suele dar 403)"
        type: boolean
        default: false
      debug:
        description: "Guardar el HTML descargado como artefacto (diagnóstico)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Descargar precios (despacio)
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: |
          python scripts/fetch_prices.py \
            --max-age "${{ github.event.inputs.max_age || '6' }}" \
            --only "${{ github.event.inputs.only || '' }}" \
            --time-budget 105 \
            ${{ github.event.inputs.scrape != 'true' && '--no-scrape' || '' }} \
            ${{ github.event.inputs.debug == 'true' && '--debug' || '' }}
      - name: Subir HTML de diagnóstico
        if: always() && github.event.inputs.debug == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: .debug/
          if-no-files-found: ignore
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/cardmarket_urls.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar precios de Cardmarket"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
